# LiveKit server config for the self-hosted deployment (see podman-compose.yml).
#
# API keys are NOT here. They come from the LIVEKIT_KEYS environment variable, which
# podman-compose.yml builds from LIVEKIT_API_KEY and LIVEKIT_API_SECRET.
#
# NOTE: this config has not been run end to end. Local verification used
# `livekit-server --dev` instead.

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # Enable this on any cloud machine behind one-to-one NAT (EC2, GCE, most VPS hosts).
  # There, the only address on the interface is the private one, so there is nothing
  # correct for autodetection to pick and candidates advertise an unroutable IP.
  # LiveKit's own sample config ships this enabled for cloud environments; leave it off
  # only for a host with a directly attached public address.
  # use_external_ip: true

# TURN relay. Off by default because it needs a real domain and a certificate.
# Turn this on when a guest cannot connect at all - see the TURN section of README.md.
turn:
  enabled: false
  # domain: livekit.example.com
  # TLS relay must listen on 443. That is the whole point: it looks like ordinary HTTPS
  # and survives restrictive firewalls. 5349 is the standard TURNS port and is exactly
  # what such a firewall blocks, so using it defeats the reason for enabling relay.
  # tls_port: 443
  # udp_port: 3478
  # LiveKit terminates TLS itself and needs both files. It reads them once at startup,
  # so a certificate renewal needs a restart, and a restart disconnects every
  # participant - schedule renewals away from recording day.
  # cert_file: /etc/livekit/tls/fullchain.pem
  # key_file: /etc/livekit/tls/privkey.pem
  #
  # Alternative: set external_tls instead of the two files above. This is NOT a
  # standalone setting - it means a TLS-terminating reverse proxy in front of LiveKit is
  # mandatory, forwarding 443 to this port. Without that proxy, relay does not work.
  # external_tls: true

logging:
  level: info
